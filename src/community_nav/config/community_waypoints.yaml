# =============================================================================
#  巡检站点表 —— community_patrol 节点读取
#
#  ⚠️ 本文件不走 ROS 2 参数系统，由 patrol_node.py 直接用 PyYAML 解析，
#     因为 ROS 2 参数不支持"字典列表"这种结构。
#
#  【坐标来源】★ 全部是从场景文件【程序化提取】的真实地标位置：
#      smart_community_ws/src/smart_community_sim/worlds/smart_community.sdf
#
#  【场地】4.2 m × 4.2 m（围墙在 ±2.103），闭环车道：
#      右路 x=0.6 向北 → 上路 y=1.3 向西 → 左路 x=-1.4 向南
#      → 中路 y=0 向东 → 中央路 x=-0.2 向南 → 下路 y=-1.3 向东
#      行驶方向与场地上的橙黄色箭头一致（顺时针）
#
#  【场景地标原表】
#      起点/终点    ( 0.95,  1.55~1.75)   机器人出生点 (1.3, 1.3) 朝 -Y
#      红绿灯 1     (-0.60,  1.55)        停止线 (-0.30,  1.30)
#      红绿灯 2     (-0.40, -1.55)        停止线 (-0.20, -1.00)
#      A 街区       x -1.20~-0.50, y 0.20~1.05    人偶 5 个 (y=0.625)
#      B 街区       x -1.20~-0.50, y -1.05~-0.20  人偶 5 个 (y=-0.625)
#      人行道人偶   6 个：(-0.6,1.7) (-1.0,1.7) (-1.7,0.9) (-1.7,-0.2)
#                         (-0.6,-1.7) (-1.0,-1.7)
#      非社区人员   2 个：f1 (0.9, 1.7)   f2 (1.0, -1.7)
#      停车位 1/2/3 ( 1.70, -1.75 / -1.15 / -0.55)   各停 1 辆车
#      斑马线       上路 x=-0.6 / 下路 x=-0.2
# =============================================================================

frame_id: map

# 跑完最后一个点后是否回到第一个点继续（比赛只需跑一圈，保持 false）
loop: false

# 单个站点导航失败时的重试次数（超过则跳过该站，继续下一站）
retry_count: 2

# 全局参数
default_dwell: 2.0          # 到点默认停留秒数（给视觉组拍照/推理时间）
navigate_timeout: 60.0      # 单站导航超时（秒）。4.2m 场地内相邻站点间距
                            # 不超过 2m，60 秒足够；设太大反而会让失败卡很久

# ---------------------------------------------------------------------------
#  action 字段可选值：
#    none          仅经过，不停留
#    capture       停车 + 停留 + 触发视觉识别（发布 /patrol/capture 话题）
#    traffic_light 停车 + 等待绿灯（订阅 /traffic_light/state）
#    finish        结束播报
# ---------------------------------------------------------------------------
waypoints:

  # ==== 出发（出生点）====
  - id: start
    name: "起点"
    x: 1.30
    y: 1.30
    yaw: -1.5708         # 朝 -Y，与出生朝向一致
    action: none
    dwell: 0.0

  # ==== 非社区人员 f1（右上角人行道）====
  - id: outsider_n
    name: "非社区人员 f1"
    x: 0.60
    y: 1.30
    yaw: 1.5708          # 朝 +Y，看向 (0.9, 1.7)
    action: capture
    dwell: 3.0
    task: "outsider_detect"
    target: "person_f1"

  # ==== 红绿灯 1（上路向西行驶时遇到）====
  - id: tl_1
    name: "红绿灯1 停止线前"
    x: -0.10
    y: 1.30
    yaw: 3.1416          # 朝 -X，正对停止线(-0.30)与信号灯(-0.60)
    action: traffic_light
    dwell: 0.0
    light_id: "tl_1"

  # ==== 北侧人行道人偶 ====
  - id: sidewalk_n
    name: "北侧人行道人偶"
    x: -0.80
    y: 1.30
    yaw: 1.5708          # 朝 +Y，看向 (-0.6,1.7) 与 (-1.0,1.7)
    action: capture
    dwell: 3.0
    task: "crowd_count"
    zone: "sidewalk_north"

  # ==== A / B 街区人偶计数（同一个路口点，转个身就能看两边）====
  - id: zone_a
    name: "A街区 人偶计数"
    x: -0.85
    y: 0.00
    yaw: 1.5708          # 朝 +Y，A街区在正前方
    action: capture
    dwell: 3.0
    task: "crowd_count"
    zone: "A"

  - id: zone_b
    name: "B街区 人偶计数"
    x: -0.85
    y: 0.00
    yaw: -1.5708         # 原地转身朝 -Y，B街区在正前方
    action: capture
    dwell: 3.0
    task: "crowd_count"
    zone: "B"

  # ==== 红绿灯 2（中央路向南行驶时遇到）====
  - id: tl_2
    name: "红绿灯2 停止线前"
    x: -0.20
    y: -0.75
    yaw: -1.5708         # 朝 -Y，正对停止线(-1.00)与信号灯(-1.55)
    action: traffic_light
    dwell: 0.0
    light_id: "tl_2"

  # ==== 三个停车位的车牌识别 ====
  - id: park_3
    name: "3号停车位 车牌识别"
    x: 0.60
    y: -0.55
    yaw: 0.0             # 朝 +X，正对 car_3 (1.7,-0.55)
    action: capture
    dwell: 3.0
    task: "plate_ocr"
    slot: 3

  - id: park_2
    name: "2号停车位 车牌识别"
    x: 0.60
    y: -1.15
    yaw: 0.0             # 朝 +X，正对 car_2 (1.7,-1.15)
    action: capture
    dwell: 3.0
    task: "plate_ocr"
    slot: 2

  # ==== 非社区人员 f2（右下角人行道）====
  - id: outsider_s
    name: "非社区人员 f2"
    x: 0.60
    y: -1.30
    yaw: -0.6            # 朝东南，看向 (1.0,-1.7)
    action: capture
    dwell: 3.0
    task: "outsider_detect"
    target: "person_f2"

  # ==== 回到终点（与起点同一位置）====
  - id: finish
    name: "终点"
    x: 1.30
    y: 1.30
    yaw: -1.5708
    action: finish
    dwell: 0.0

# =============================================================================
#  使用说明
#
#  1. **建好地图后必须复核**：在 RViz 里用 "2D Goal Pose" 逐个点一遍上面的坐标，
#     确认落在【车道中间】、不在墙里、不在人偶立牌上。
#     上面所有坐标都已按车道中心线选取（上路 y=1.3、右路 x=0.6、下路 y=-1.3、
#     中央路 x=-0.2、中路 y=0、左路 x=-1.4），但**仍需实跑确认**。
#  2. 站点坐标是**车体中心**要到达的位置，不是物料位置。
#     停靠点离物料 0.3~0.6 m，保证相机视野完整。
#  3. yaw 决定车头朝向：
#        0      = 朝 +X        1.5708  = 朝 +Y
#        3.1416 = 朝 -X       -1.5708  = 朝 -Y
#     ★ 这一步必须和视觉组一起定，朝向错了相机拍不到目标。
#  4. 当前共 10 个站点，跑完一圈里程约 8~10 m，按 0.2 m/s 算约 1 分钟，
#     加上每站停留 3 秒，整圈约 1.5~2 分钟。**非常适合录视频。**
# =============================================================================
