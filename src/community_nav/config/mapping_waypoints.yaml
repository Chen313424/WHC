# =============================================================================
#  自主建图回路 —— 建图阶段使用（mapping.launch.py 启动后自动走一遍）
#
#  ⚠️ 与 community_waypoints.yaml（巡检站点表）的区别：
#     · 巡检表走的是【站点】—— 只覆盖停靠识别点，会跳过部分车道；
#     · 本表走的是【全车道回路】—— 沿回字形道路的 6 段中心线各走一遍，
#       保证激光雷达扫到所有围墙/街区外墙，建出的地图完整无空洞。
#
#  【坐标来源】从场景文件程序化提取的真实道路中心线：
#      smart_community_ws/src/smart_community_sim/worlds/smart_community.sdf
#    上路 y=1.3（x∈[-1.4,0.6]）   左路 x=-1.4（y∈[0,1.3]）
#    中路 y=0.0（x∈[-1.4,-0.2]）  中央路 x=-0.2（y∈[-1.3,0]）
#    下路 y=-1.3（x∈[-0.2,0.6]）  右路 x=0.6（y∈[-1.3,1.3]）
#
#  回路方向与场地橙黄色箭头一致（顺时针）：
#     上路(西) → 左路(南) → 中路(东) → 中央路(南) → 下路(东) → 右路(北) → 回上路
#
#  出发区（机器人出生点）在回字形道路【外】的 (1.3,1.3)，所以本表
#  先驶入上路东口 (0.6,1.3)，绕完一圈后从同一口驶出，回到出生点。
# =============================================================================

frame_id: map

# 建图只需走一遍，不需要回到起点循环
loop: false

# 导航失败重试次数（超过则跳过，继续下一段，避免卡死整圈建图）
retry_count: 2

# 全局参数
default_dwell: 0.0          # 建图不停留（没有拍照/识别任务），到点即走下一段
navigate_timeout: 90.0      # 单段导航超时。建图时地图尚在生长、未知区域
                            # 会被视为可通行（track_unknown_space: true），
                            # 规划可能略慢，给足 90s 更稳妥

# ---------------------------------------------------------------------------
#  action 全部为 none（纯经过不停留）；最后一个 finish 结束。
# ---------------------------------------------------------------------------
waypoints:

  # ==== 出发区 → 驶入上路东口 ====
  - id: start
    name: "出发区"
    x: 1.30
    y: 1.30
    yaw: 3.1416           # 朝 -X，驶向上路东口 (0.6,1.3)
    action: none

  - id: loop_top_east
    name: "上路东口/右路北口"
    x: 0.60
    y: 1.30
    yaw: 3.1416           # 继续朝 -X，沿上路向西
    action: none

  # ==== 上路（西行）→ 左路北口 ====
  - id: loop_top_west
    name: "上路西口/左路北口"
    x: -1.40
    y: 1.30
    yaw: -1.5708          # 转向朝 -Y，沿左路向南
    action: none

  # ==== 左路（南行）→ 中路西口 ====
  - id: loop_left_south
    name: "左路南口/中路西口"
    x: -1.40
    y: 0.00
    yaw: 0.0              # 转向朝 +X，沿中路向东
    action: none

  # ==== 中路（东行）→ 中央路北口 ====
  - id: loop_mid_east
    name: "中路东口/中央路北口"
    x: -0.20
    y: 0.00
    yaw: -1.5708          # 转向朝 -Y，沿中央路向南
    action: none

  # ==== 中央路（南行）→ 下路西口 ====
  - id: loop_central_south
    name: "中央路南口/下路西口"
    x: -0.20
    y: -1.30
    yaw: 0.0              # 转向朝 +X，沿下路向东
    action: none

  # ==== 下路（东行）→ 右路南口 ====
  - id: loop_bottom_east
    name: "下路东口/右路南口"
    x: 0.60
    y: -1.30
    yaw: 1.5708           # 转向朝 +Y，沿右路向北
    action: none

  # ==== 右路（北行）→ 回到上路东口，闭环完成 ====
  - id: loop_right_north
    name: "右路北口(回上路东口)"
    x: 0.60
    y: 1.30
    yaw: 0.0              # 转向朝 +X，驶出回字形、返回出发区
    action: none

  # ==== 驶出回路 → 回到出发区 ====
  - id: finish
    name: "返回出发区"
    x: 1.30
    y: 1.30
    yaw: -1.5708          # 恢复出生朝向 -Y，与巡检表 finish 一致
    action: finish
